---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: networkpolicies.networking.ryvn.app
spec:
  group: networking.ryvn.app
  names:
    kind: NetworkPolicy
    listKind: NetworkPolicyList
    plural: networkpolicies
    shortNames:
    - rnp
    - ryvnnp
    - ryvnnetworkpolicy
    singular: networkpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .status.conditions[?(@.type=="Accepted")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetworkPolicy is the Ryvn Network Policy (networking.ryvn.app), not the
          Kubernetes networking.k8s.io NetworkPolicy. It describes the egress traffic
          allowed from a set of pods in its namespace.
          More info: https://ryvn.ai/docs/networking/network-policy
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetworkPolicySpec defines the desired state of NetworkPolicy.
            properties:
              egress:
                description: |-
                  Egress lists the rules that allow traffic from the selected pods. Traffic
                  from a pod is allowed if it matches a rule in any policy that selects the
                  pod, so rule order does not matter. An empty list allows nothing and
                  isolates the selected pods.
                items:
                  description: |-
                    EgressRule allows traffic from the selected pods that matches both to and
                    protocols.
                  properties:
                    name:
                      description: |-
                        Name identifies the rule in status messages. It must be unique within the
                        policy.
                      maxLength: 100
                      minLength: 1
                      type: string
                    protocols:
                      description: |-
                        Protocols restricts the rule to the listed destination ports. If omitted,
                        the rule allows every port and protocol.
                      items:
                        description: |-
                          Protocol matches a TCP or UDP destination port. Exactly one of tcp or udp
                          must be set.
                        properties:
                          tcp:
                            description: TCP matches a TCP destination port.
                            properties:
                              destinationPort:
                                description: DestinationPort is the port on the destination.
                                properties:
                                  number:
                                    description: Number is the port number.
                                    format: int32
                                    maximum: 65535
                                    minimum: 1
                                    type: integer
                                required:
                                - number
                                type: object
                            required:
                            - destinationPort
                            type: object
                          udp:
                            description: UDP matches a UDP destination port.
                            properties:
                              destinationPort:
                                description: DestinationPort is the port on the destination.
                                properties:
                                  number:
                                    description: Number is the port number.
                                    format: int32
                                    maximum: 65535
                                    minimum: 1
                                    type: integer
                                required:
                                - number
                                type: object
                            required:
                            - destinationPort
                            type: object
                        type: object
                        x-kubernetes-validations:
                        - message: protocol must set exactly one of tcp or udp
                          rule: has(self.tcp) != has(self.udp)
                      maxItems: 40
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                    to:
                      description: To lists the destinations this rule allows.
                      items:
                        description: |-
                          EgressPeer is one destination. Exactly one of domainNames, networks,
                          namespaces, or pods must be set.
                        properties:
                          domainNames:
                            description: |-
                              DomainNames lists exact hostnames, for example api.example.com. Traffic
                              is allowed to the addresses those names resolve to. Wildcards are not
                              supported.
                            items:
                              description: |-
                                DomainName is one exact hostname: lowercase, at least two labels of at most
                                63 characters each, no wildcard, scheme, port, path, or trailing dot.
                              maxLength: 253
                              minLength: 3
                              pattern: ^([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\.)+[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                              type: string
                            maxItems: 25
                            minItems: 1
                            type: array
                            x-kubernetes-list-type: set
                          namespaces:
                            description: |-
                              Namespaces selects every pod in the matching namespaces. An empty
                              selector selects every namespace. Host-networked pods are not included.
                            properties:
                              matchExpressions:
                                description: matchExpressions is a list of label selector
                                  requirements. The requirements are ANDed.
                                items:
                                  description: |-
                                    A label selector requirement is a selector that contains values, a key, and an operator that
                                    relates the key and values.
                                  properties:
                                    key:
                                      description: key is the label key that the selector
                                        applies to.
                                      type: string
                                    operator:
                                      description: |-
                                        operator represents a key's relationship to a set of values.
                                        Valid operators are In, NotIn, Exists and DoesNotExist.
                                      type: string
                                    values:
                                      description: |-
                                        values is an array of string values. If the operator is In or NotIn,
                                        the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                        the values array must be empty. This array is replaced during a strategic
                                        merge patch.
                                      items:
                                        type: string
                                      type: array
                                      x-kubernetes-list-type: atomic
                                  required:
                                  - key
                                  - operator
                                  type: object
                                type: array
                                x-kubernetes-list-type: atomic
                              matchLabels:
                                additionalProperties:
                                  type: string
                                description: |-
                                  matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                  map is equivalent to an element of matchExpressions, whose key field is "key", the
                                  operator is "In", and the values array contains only "value". The requirements are ANDed.
                                type: object
                            type: object
                            x-kubernetes-map-type: atomic
                          networks:
                            description: |-
                              Networks lists destination networks in CIDR notation, IPv4 or IPv6, for
                              example 198.51.100.0/24 or 2001:db8::/32. Pod and Service addresses are not
                              matched; use namespaces or pods for destinations inside the cluster.
                            items:
                              description: |-
                                CIDR is an IPv4 or IPv6 network in CIDR notation, for example
                                198.51.100.0/24 or 2001:db8::/32.
                              maxLength: 43
                              type: string
                              x-kubernetes-validations:
                              - message: networks entries must be in CIDR notation,
                                  for example 198.51.100.0/24 or 2001:db8::/32
                                rule: isCIDR(self)
                              - message: networks entries must be in canonical form,
                                  for example 198.51.100.0/24, not 198.51.100.7/24
                                rule: '!isCIDR(self) || string(cidr(self).masked())
                                  == self'
                            maxItems: 25
                            minItems: 1
                            type: array
                            x-kubernetes-list-type: set
                          pods:
                            description: |-
                              Pods selects destination pods by namespace and pod labels.
                              Host-networked pods are not included.
                            properties:
                              namespaceSelector:
                                description: |-
                                  NamespaceSelector follows standard label selector semantics. Omitted or
                                  empty selects every namespace, not only the policy's own.
                                properties:
                                  matchExpressions:
                                    description: matchExpressions is a list of label
                                      selector requirements. The requirements are
                                      ANDed.
                                    items:
                                      description: |-
                                        A label selector requirement is a selector that contains values, a key, and an operator that
                                        relates the key and values.
                                      properties:
                                        key:
                                          description: key is the label key that the
                                            selector applies to.
                                          type: string
                                        operator:
                                          description: |-
                                            operator represents a key's relationship to a set of values.
                                            Valid operators are In, NotIn, Exists and DoesNotExist.
                                          type: string
                                        values:
                                          description: |-
                                            values is an array of string values. If the operator is In or NotIn,
                                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                            the values array must be empty. This array is replaced during a strategic
                                            merge patch.
                                          items:
                                            type: string
                                          type: array
                                          x-kubernetes-list-type: atomic
                                      required:
                                      - key
                                      - operator
                                      type: object
                                    type: array
                                    x-kubernetes-list-type: atomic
                                  matchLabels:
                                    additionalProperties:
                                      type: string
                                    description: |-
                                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                                    type: object
                                type: object
                                x-kubernetes-map-type: atomic
                              podSelector:
                                description: |-
                                  PodSelector selects pods within the selected namespaces. An empty selector
                                  selects every pod.
                                properties:
                                  matchExpressions:
                                    description: matchExpressions is a list of label
                                      selector requirements. The requirements are
                                      ANDed.
                                    items:
                                      description: |-
                                        A label selector requirement is a selector that contains values, a key, and an operator that
                                        relates the key and values.
                                      properties:
                                        key:
                                          description: key is the label key that the
                                            selector applies to.
                                          type: string
                                        operator:
                                          description: |-
                                            operator represents a key's relationship to a set of values.
                                            Valid operators are In, NotIn, Exists and DoesNotExist.
                                          type: string
                                        values:
                                          description: |-
                                            values is an array of string values. If the operator is In or NotIn,
                                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                            the values array must be empty. This array is replaced during a strategic
                                            merge patch.
                                          items:
                                            type: string
                                          type: array
                                          x-kubernetes-list-type: atomic
                                      required:
                                      - key
                                      - operator
                                      type: object
                                    type: array
                                    x-kubernetes-list-type: atomic
                                  matchLabels:
                                    additionalProperties:
                                      type: string
                                    description: |-
                                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                                    type: object
                                type: object
                                x-kubernetes-map-type: atomic
                            required:
                            - podSelector
                            type: object
                        type: object
                        x-kubernetes-validations:
                        - message: peer must set exactly one of domainNames, networks,
                            namespaces, or pods
                          rule: '(has(self.domainNames) ? 1 : 0) + (has(self.networks)
                            ? 1 : 0) + (has(self.namespaces) ? 1 : 0) + (has(self.pods)
                            ? 1 : 0) == 1'
                      maxItems: 25
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                  required:
                  - name
                  - to
                  type: object
                  x-kubernetes-validations:
                  - message: a rule may list at most 25 domainNames
                    rule: 'self.to.map(p, has(p.domainNames) ? p.domainNames.size()
                      : 0).sum() <= 25'
                maxItems: 25
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              podSelector:
                description: |-
                  PodSelector selects the pods this policy applies to, in the policy's
                  namespace. An empty selector selects every pod in the namespace. The
                  policy does not apply to host-networked pods.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            required:
            - egress
            - podSelector
            type: object
          status:
            description: NetworkPolicyStatus is the observed state, written by Ryvn.
            properties:
              conditions:
                description: |-
                  Conditions holds Accepted, which is True when the policy is valid and this
                  cluster can enforce every rule.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: condition reason must be one of the recognized Ryvn NetworkPolicy
                    reasons
                  rule: self.all(c, c.reason in ['Accepted','Invalid'])
              observedGeneration:
                description: ObservedGeneration is the metadata.generation the conditions
                  describe.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be at most 63 characters
          rule: self.metadata.name.size() <= 63
    served: true
    storage: true
    subresources:
      status: {}
